openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /health:
    get:
      operationId: health
      tags: [health]
      summary: Health check (alias)
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /db-check:
    get:
      operationId: dbCheck
      tags: [health]
      summary: Database connectivity check
      description: Verifies connectivity to the Supabase Postgres database
      responses:
        "200":
          description: Database reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DbCheckStatus"
        "500":
          description: Database unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    DbCheckStatus:
      type: object
      properties:
        status:
          type: string
        database:
          type: string
      required:
        - status
        - database
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

