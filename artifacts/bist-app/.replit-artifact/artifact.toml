kind = "web"
previewPath = "/"
title = "BIST Production System"
version = "1.0.0"
id = "artifacts/bist-app"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24171

[services.development]
run = "pnpm --filter @workspace/bist-app run dev"

[services.production]
publicDir = "artifacts/bist-app/dist/public"
serve = "static"

[services.production.build]
args = [ "pnpm", "--filter", "@workspace/bist-app", "run", "build:production" ]

[services.production.build.env]
VITE_APP_ENV = "TEST"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24171"
BASE_PATH = "/"
VITE_APP_ENV = "TEST"
